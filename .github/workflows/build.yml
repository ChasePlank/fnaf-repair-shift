name: Build game

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  RENPY_VERSION: "8.3.7"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: project

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Ren'Py SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: renpy-sdk
          key: renpy-${{ env.RENPY_VERSION }}-sdk-web-rapt-v1

      - name: Download Ren'Py SDK, web and Android support
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          V=$RENPY_VERSION
          curl -sL -o sdk.tar.bz2 https://www.renpy.org/dl/$V/renpy-$V-sdk.tar.bz2
          tar xjf sdk.tar.bz2
          mv renpy-$V-sdk renpy-sdk
          cd renpy-sdk
          curl -sL -o web.zip  https://www.renpy.org/dl/$V/renpy-$V-web.zip  && unzip -q web.zip  && rm web.zip
          curl -sL -o rapt.zip https://www.renpy.org/dl/$V/renpy-$V-rapt.zip && unzip -q rapt.zip && rm rapt.zip

      - name: Install Android SDK (via Ren'Py's installer)
        run: |
          cat > /tmp/sdkwrap.py <<EOF
          import sys, os
          sdk = os.path.abspath("renpy-sdk")
          sys.path.insert(0, sdk)
          sys.path.insert(0, os.path.join(sdk, "rapt", "buildlib"))
          os.chdir(os.path.join(sdk, "rapt"))
          sys.argv = ["android.py", "installsdk"]
          exec(compile(open("android.py").read(), "android.py", "exec"))
          EOF
          yes y | renpy-sdk/lib/py3-linux-x86_64/python /tmp/sdkwrap.py | tail -5

      - name: Restore Android signing keys
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          BUNDLE_KEYSTORE_B64: ${{ secrets.BUNDLE_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then echo "$ANDROID_KEYSTORE_B64" | base64 -d > project/android.keystore; fi
          if [ -n "$BUNDLE_KEYSTORE_B64" ];  then echo "$BUNDLE_KEYSTORE_B64"  | base64 -d > project/bundle.keystore;  fi

      - name: Lint
        run: |
          export SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy
          renpy-sdk/renpy.sh project lint | tee lint.txt
          if grep -qE "^game/.*rpy:[0-9]+" lint.txt; then echo "::error::Lint found problems"; exit 1; fi

      - name: Build Windows / Linux / macOS
        run: |
          export SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy
          renpy-sdk/renpy.sh renpy-sdk/launcher distribute project --package pc --package mac --destination out

      - name: Build web
        run: |
          export SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy
          renpy-sdk/renpy.sh renpy-sdk/launcher web_build project --destination out/web
          (cd out/web && zip -qr ../RepairShift-web.zip .)

      - name: Build Android APK
        run: |
          export SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy
          renpy-sdk/renpy.sh renpy-sdk/launcher android_build project --destination out/android
          ls -la out/android

      - uses: actions/upload-artifact@v5
        with: { name: RepairShift-windows-linux, path: out/*-pc.zip }
      - uses: actions/upload-artifact@v5
        with: { name: RepairShift-mac, path: out/*-mac.zip }
      - uses: actions/upload-artifact@v5
        with: { name: RepairShift-android, path: out/android/*.apk }
      - uses: actions/upload-artifact@v5
        with: { name: RepairShift-web, path: out/RepairShift-web.zip }

      ## Builds are also published as GitHub Releases for easy downloading. (Actions artifact storage is
      - name: Publish rolling "latest" build (pushes to main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd project
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest --prerelease --target "$GITHUB_SHA" \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Automatic build of the newest commit on main. Windows/Linux: -pc.zip. macOS: -mac.zip. Android: .apk. Web: -web.zip." \
            ../out/*-pc.zip ../out/*-mac.zip ../out/android/*.apk ../out/RepairShift-web.zip

      - name: Publish versioned release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd project
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            ../out/*-pc.zip ../out/*-mac.zip ../out/android/*.apk ../out/RepairShift-web.zip
